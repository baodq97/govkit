name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # drift + ledger read commit history; a shallow clone reads as 'no history'

      # Dev toolchain is bun (ADR-0002): install + the test runner.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The one-shot FULL gate (`bun run check`): check-sync + skill-lint (both plugins) +
      # Biome + typecheck + build (tsup) + tests (bun test) + `govkit check` (verify + eval)
      # + calibrate + drift + ledger. No ANTHROPIC_API_KEY, no Claude — the deterministic
      # layers run with no key, so a non-Claude contributor's PR is gated identically.
      # The chain runs the shipped bundle under BOTH bun and stock node
      # (govkit-check + govkit-check:node), so the Node-portability of the published
      # artifact (ADR-0002 §3) is a tested assertion, not a hope.
      - run: bun run check
