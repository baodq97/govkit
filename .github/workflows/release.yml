name: release

# R0 publish path: push a tag `v<version>` matching packages/govkit/package.json
# and this workflow publishes the engine to npm with provenance.
# One-time setup (human act): add an npm automation token as the NPM_TOKEN
# repository secret (Settings → Secrets and variables → Actions).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm --provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The same one-shot gate CI runs — a release must clear everything a PR does.
      - run: bun run check

      - name: Setup Node (registry auth + provenance)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Guard: the tag must equal the engine version, or the publish stops here —
      # a stale tag must not ship a mismatched artifact.
      - name: Assert tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/govkit/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION != packages/govkit version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish govkit
        working-directory: packages/govkit
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
