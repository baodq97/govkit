name: release

# R0 publish path, ONE trigger: push a tag `v<version>` matching
# packages/govkit/package.json and this workflow publishes the engine to npm and
# creates the GitHub Release. workflow_dispatch was removed after the 0.8.0
# release ran twice (dispatch + tag push three minutes apart — the duplicate had
# to be hand-cancelled); tag pushes are proven to work from every environment
# this repo is driven from, so the escape hatch cost more than it covered.
# One-time setup (human act): add an npm automation token as the NPM_TOKEN
# repository secret (Settings → Secrets and variables → Actions).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create needs it; checkout only reads
      # id-token: write — restore together with --provenance the day the repo goes public
      # (npm 422s provenance bundles from private source repos; an unused write grant is
      # pure token scope until then).
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # drift + ledger read commit history; a shallow clone reads as 'no history'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The same one-shot gate CI runs — a release must clear everything a PR does.
      - run: bun run check

      - name: Setup Node (registry auth + provenance)
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Guard: the tag must equal the engine version, or the publish stops here —
      # a stale tag must not ship a mismatched artifact. Unconditional now that the
      # tag push is the only trigger.
      - name: Assert tag matches package version
        run: |
          PKG_VERSION="$(node -p "require('./packages/govkit/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "tag v$TAG_VERSION != packages/govkit version $PKG_VERSION" >&2
            exit 1
          fi

      # The packaging guard tsup.config.ts names: prove the packed tarball carries dist +
      # templates and runs under stock node with no unbundled deps — the one failure class
      # (an un-inlined runtime dep) nothing in `bun run check` can catch.
      - name: Pack proof
        working-directory: packages/govkit
        run: npm run pack:proof

      # --provenance is off: npm 422s provenance bundles from PRIVATE source repos
      # ("Only public source repositories are supported"). Re-add the flag the day
      # this repo goes public — the marketplace install flow wants that anyway.
      - name: Publish govkit
        working-directory: packages/govkit
        run: npm publish --access public

      # The Release object is part of the release, not an afterthought — v0.8.0 shipped to
      # npm with no GitHub Release until a human noticed. Notes point at the governed REL
      # doc (the record of truth); --generate-notes fills the commit list. Idempotent: skip
      # if the release already exists (a re-run after a partial failure must not error here).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists — skipping"
          else
            REL_DOC="$(ls docs/releases/REL-*-govkit-${GITHUB_REF_NAME#v}.md 2>/dev/null | head -1)"
            NOTES="Governed release record: ${REL_DOC:-docs/releases/ (no REL doc found for this tag — author one)}"
            gh release create "$GITHUB_REF_NAME" --title "govkit $GITHUB_REF_NAME" \
              --notes "$NOTES" --generate-notes
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
