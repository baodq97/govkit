context: Maintenance
subdomain_type: supporting
ubiquitous_language:
  - term: Maintenance record
    definition: A unit's service schedule - last serviced, interval, out-of-service flag.
  - term: Next due
    definition: lastServiced + intervalDays.
  - term: Out of service
    definition: A unit pulled for service; Allocation queries this to keep it off the books.
aggregates:
  - name: MaintenanceRecord
    root: MaintenanceRecord
    entities:
      - { name: MaintenanceRecord, attributes: [id, assetTag, lastServiced, intervalDays, outOfService] }
    value_objects: []
    domain_events: []
    invariants:
      - Interval days must be positive and an asset tag is required to create a record.
relationships:
  - { to: Fleet, type: downstream }
  - { to: Allocation, type: upstream }
