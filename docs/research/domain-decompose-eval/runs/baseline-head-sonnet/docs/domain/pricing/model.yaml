context: Pricing
subdomain_type: supporting   # assumption — see QUESTIONS.md Q1
ubiquitous_language:
  - term: Quote
    definition: An ephemeral, computed price for a category at a given utilization; not persisted.
  - term: Utilization
    definition: How heavily the fleet is currently used (0–1); drives the discount floor.
  - term: Floor
    definition: The minimum acceptable price at a given utilization; no discount may cross it.
aggregates:
  - name: Quote
    root: Quote
    entities: []
    value_objects:
      - name: Quote
        attributes: [category, amount, utilization, contractVersion]
        note: >
          Ephemeral computed value, no persisted identity — modeled as a value object, not an
          entity. Grouped under a nominal "aggregate" only to satisfy the model.yaml schema shape;
          Pricing has no true aggregate root / consistency boundary in the read code.
    domain_events:
      - name: PriceQuoted
        payload: [category, amount, utilization, contractVersion]
        note: >
          Published on the stable, versioned Pricing.Contracts package (v1 -> v2 changelog in
          code) — the system's candidate load-bearing extraction seam; see context-map.md.
    invariants:
      - "A quote can never fall below a floor derived from fleet utilization (floor = 0.60 + 0.40 x utilization, of list rate); at 100% utilization no discount is permitted at all."
relationships:
  - to: Rentals
    type: open-host
    note: >
      Publishes PriceQuoted via the separate Pricing.Contracts package; Rentals may depend only on
      that contract, never on Pricing internals (enforced by project reference in Rentals.csproj).
