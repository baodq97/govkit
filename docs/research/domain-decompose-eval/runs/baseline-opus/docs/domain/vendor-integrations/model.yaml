notes: >
  Generic, off-the-shelf commodity services behind thin adapters (Stripe, Auth0, SendGrid). None
  carry business rules; each wraps a vendor SDK and could be swapped. No model to build. Grouped as
  one generic context because the code and config treat them as one set of thin adapters with "no
  model to build here" — whether to split into separate service boundaries is a genuine question
  (QUESTIONS.md Q5).
