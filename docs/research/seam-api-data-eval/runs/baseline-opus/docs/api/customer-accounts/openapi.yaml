openapi: 3.1.0
info:
  title: RentField Customer Accounts API
  version: 1.0.0
  description: |
    Customer Accounts bounded context (DOMAIN-0008, supporting). Read model over customer accounts
    conformed verbatim from the third-party CRM (nightly import). Read-only; Rentals consumes the
    account lookup.
  contact:
    name: Platform team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.rentfield.example.com/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Accounts
    description: Read customer accounts (CRM-conformed)
paths:
  /accounts:
    get:
      summary: List customer accounts
      operationId: listAccounts
      tags: [Accounts]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: segment
          in: query
          description: Filter by CRM segment code (verbatim).
          required: false
          schema: { type: string }
        - name: salesRepId
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        description: CRM account id, verbatim format.
        schema: { type: string }
    get:
      summary: Get a customer account (lookup consumed by Rentals)
      operationId: getAccount
      tags: [Accounts]
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued JWT access token (Identity context).
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    SalesAccount:
      type: object
      required: [accountId, name, segment]
      properties:
        accountId:
          type: string
          description: CRM id, verbatim.
          example: ACC-88213
        name: { type: string, example: Northgate Plant Hire }
        segment:
          type: string
          description: CRM segment code, taken verbatim (opaque; not re-mapped).
          example: MID-MARKET
        salesRepId:
          type: string
          description: Commercial-owner projection (rep who owns the relationship).
          example: REP-014
    AccountListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/SalesAccount' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [offset, limit, total, has_more]
      properties:
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
