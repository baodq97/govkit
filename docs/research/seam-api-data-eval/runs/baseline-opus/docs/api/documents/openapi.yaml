openapi: 3.1.0
info:
  title: RentField Documents API
  version: 1.0.0
  description: |
    Documents bounded context (DOMAIN-0010, supporting). Files attached to rentals and accounts.
    CRUD plus one authorization rule: only the uploader (owner) or an admin may delete.
  contact:
    name: Platform team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.rentfield.example.com/v1
    description: Production
  - url: http://localhost:3000/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Documents
    description: Upload, read, and delete attached files
paths:
  /documents:
    get:
      summary: List documents
      operationId: listDocuments
      tags: [Documents]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - name: linkedEntityId
          in: query
          description: Filter to files attached to one rental or account.
          required: false
          schema: { type: string }
      responses:
        '200':
          description: A page of documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentListResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Upload a document
      operationId: uploadDocument
      tags: [Documents]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, linkedEntityId]
              properties:
                file:
                  type: string
                  format: binary
                linkedEntityId:
                  type: string
                  description: The rental or account this file attaches to.
      responses:
        '201':
          description: Uploaded
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get document metadata
      operationId: getDocument
      tags: [Documents]
      responses:
        '200':
          description: The document metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a document (owner or admin only)
      description: Only the uploader (ownerUserId) or an admin may delete. Otherwise 403.
      operationId: deleteDocument
      tags: [Documents]
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is neither the owner nor an admin
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://api.rentfield.example.com/problems/forbidden
                title: Forbidden
                status: 403
                detail: Only the uploader or an admin may delete this document.
                instance: /documents/{documentId}
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{documentId}/content:
    parameters:
      - name: documentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Download the document bytes
      operationId: getDocumentContent
      tags: [Documents]
      responses:
        '200':
          description: The file bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0-issued JWT access token (Identity context).
  parameters:
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    Document:
      type: object
      required: [id, ownerUserId, linkedEntityId, filename]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        ownerUserId:
          type: string
          description: Uploader-owner projection (who may delete). Not audit metadata.
          readOnly: true
        linkedEntityId:
          type: string
          description: The rental or account the file is attached to (cross-context id).
        filename: { type: string, example: signed-agreement.pdf }
        contentType: { type: string, example: application/pdf }
        sizeBytes: { type: integer, minimum: 0, readOnly: true }
        uploadedAt: { type: string, format: date-time, readOnly: true }
    DocumentListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Document' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [offset, limit, total, has_more]
      properties:
        offset: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
