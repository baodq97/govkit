context: FiscalRecord
subdomain_type: supporting
tactical_pattern: transaction-script
ubiquitous_language:
  - term: Fiscal record
    definition: Site, entry time, exit time, amount, VAT, payment method, machine paid at — not the plate.
  - term: Retention period
    definition: Per country — DE 10 years (GoBD), AT 10, NL 7, FR unknown.
aggregates: []
notes: >-
  Deliberately light — an append-only record with one writer plus a per-country retention parameter.
  Kept as its own context rather than declined as cross-cutting audit because its invariants are real
  and legal (fixed content, country-specific retention, must outlive the visit and the card). Open:
  H8 (France and beyond; disposal when a site or operator leaves), H13 (nothing identifies the visit
  the record belongs to). Escalation: legal hold or chain-of-evidence would earn this an aggregate.
relationships:
  - to: ParkingVisit
    direction: downstream
    our_roles: [conformist]
    their_roles: [published-language]
    note: >-
      ParkingVisit publishes the fiscal facts — entry time, exit time, amount, VAT. No named message
      exists for this edge, but the stance is readable: `README.md` types this row "published
      language, downstream" and the PaymentCapture row below it "ACL, downstream", so the same table
      chose a translation once and not here. We take the facts in their terms and store them.
  - to: PaymentCapture
    direction: downstream
    our_roles: [acl]
    their_roles: [other]
    note: >-
      Payment method and the machine paid at, translated at our edge. PaymentCapture is bought and
      excluded by INPUT.md §7.3, so nothing names its upstream stance (H9) — `other` here is that
      absence, not a gap in this file. Naming it would decide H9 by writing YAML.
