# govkit governance schema — the single pluggable interface the engine reads.
# Doc dirs, required keys, lifecycle states, and the quality rubric are CONFIG,
# not hardcoded in the CLI, so any repo (any doc layout / quality bar) adopts
# govkit by editing this file.
schemaVersion: 1

# ── Layer 1: the structural GATE (`govkit verify`) ───────────────────────────
# Front-matter completeness · status ∈ allowed set · id↔filename convention ·
# INDEX sync · globally-unique ids · no unresolved placeholders. Binary pass/fail.
docs:
  ignore: [INDEX.md, _TEMPLATE.md]
  base:
    required: [id, title, status, owner, date]
  types:
    prd:
      dir: docs/product
      required: [id, title, status, owner, date]
      idPrefix: PRD
      startStatus: draft
      statuses: [draft, review, approved, rejected, superseded]
    rfc:
      dir: docs/rfc
      required: [id, title, status, owner, date]
      idPrefix: RFC
      startStatus: draft
      # `implemented` (RFC-0010) is the post-acceptance state: design decided AND code shipped +
      # reconciled. It is distinct from `accepted` precisely so the as-built gate below can fire
      # AFTER implementation, never at accept-time (before any divergence can exist).
      statuses: [draft, proposed, accepted, implemented, rejected, superseded]
      # Chain-status coherence (RFC-0008): the decided/terminal subset. A child that has
      # shipped may not hang off an RFC still draft/proposed/rejected (its design undecided).
      # `implemented` joins the terminal set (even more decided than accepted).
      terminalStatuses: [accepted, implemented, superseded]
      # Status-conditional required sections (RFC-0010): an RFC at `implemented` must carry an
      # as-built / deviations note — the forcing function that makes design↔code divergence a
      # recorded ritual, fired exactly when implementation has met the design. Keyed to
      # `implemented`, NOT terminalStatuses (which includes `accepted`, pre-implementation).
      # Inert until an RFC is flipped to `implemented` — zero-false-positive before then.
      requiredSectionsByStatus:
        implemented: ["As-built", "Deviations from design"]
    adr:
      dir: docs/adr
      required: [id, title, status, owner, date]
      idPrefix: ADR
      startStatus: proposed
      statuses: [proposed, accepted, rejected, superseded]
      terminalStatuses: [accepted, superseded]
      # Chain referential-integrity (RFC-0003): an ADR's optional `parent` must resolve to a
      # real id. Resolve-only — empty `parent` (a root ADR) is skipped, `type` is advisory.
      refs: [{ key: parent, type: rfc }]
    us:
      dir: docs/issues
      required: [id, title, status, owner, date, priority]
      idPrefix: US
      startStatus: open
      statuses: [open, in-progress, blocked, done, wontfix]
      # Terminal = shipped only. `wontfix` is deliberately NOT terminal here: a won't-fix issue
      # under a draft RFC is not the "shipped an undecided design" inconsistency the gate targets.
      terminalStatuses: [done]
      # A US's `parent` (the RFC/ADR it implements) must resolve to a real id.
      refs: [{ key: parent, type: rfc }]
    domain:
      dir: docs/domain
      required: [id, title, status, owner, date]
      idPrefix: DOMAIN
      startStatus: draft
      statuses: [draft, review, accepted, superseded]
      recursive: true
      idFilenameConvention: false
    rel:
      dir: docs/releases
      required: [id, title, status, owner, date]
      idPrefix: REL
      startStatus: draft
      statuses: [draft, released, superseded]
      terminalStatuses: [released, superseded]
      # Status-conditional required sections, same forcing-function pattern as RFC's
      # `implemented`: a release at `released` must record what shipped and how to recover.
      # Inert until a REL is flipped to `released` — zero-false-positive before then.
      requiredSectionsByStatus:
        released: ["What shipped", "Migration", "Rollback", "Post-publish smoke"]
      # A release's `parent` (the RFC it ships) must resolve to a real id. Resolve-only.
      refs: [{ key: parent, type: rfc }]

# ── Layer 2: the quality EVAL (`govkit eval`) ────────────────────────────────
# An HONEST deterministic, no-API-key layer. It is a STRUCTURAL FLOOR, not a
# substance judge: a presence/shape rubric cannot tell a real artifact from a
# keyword-salad with the right headings (same lexical fingerprint). So:
#   • CI BLOCKS only on `required:` rules — a tiny floor (not a stub, no filler)
#     tuned for ZERO false-positive on legitimate docs. A determined gamer can
#     pass the floor; that is by design — the swe-flow `reviewer` agent (opt-in,
#     needs a key, never in no-key CI) is the substance judge. See RFC-0001.
#   • The 0–100 `score` is ADVISORY: it rewards distinct canonical sections and
#     a quality trend to watch; below `threshold` warns, it does NOT block.
# Section rules match DISTINCT headings (one heading ≠ four sections); regex/
# minWords run on prose with code fences + comments stripped.
eval:
  threshold: 70
  rubrics:
    prd:
      - { id: problem, weight: 20, kind: section, pattern: 'problem|background|context|motivation|why|status quo|pain', desc: "problem framing" }
      - { id: persona, weight: 20, kind: section, pattern: 'persona|user|audience|who|customer|segment|stakeholder|icp|target', desc: "explicit persona / audience" }
      - { id: metric, weight: 20, kind: section, pattern: 'success|metric|kpi|goal|objective|outcome|target|north star', desc: "success-metric section" }
      - { id: scope, weight: 15, kind: section, pattern: 'scope|non-?goal|out of scope|boundaries|deliverable', desc: "scope / non-goals" }
      - { id: kpi, weight: 10, kind: regex, pattern: '\$?\d+\s*(%|percent|x\b|ms\b|/s|/mo|/day|k\b|m\b|bps|users|req)|\bfrom\s+\d+\b.*\bto\s+\d+\b', desc: "a quantified target (advisory; cannot judge if meaningful)" }
      - { id: substance, weight: 10, kind: minWords, min: 40, required: true, desc: "not an empty stub (≥40 words of prose)" }
      - { id: nofiller, weight: 5, kind: forbid, pattern: 'lorem ipsum|to be filled (in|out)|to be written|todo:?\s*write|placeholder text|fill (this )?in later|insert [a-z ]+ here', required: true, desc: "no template filler left in" }
    rfc:
      - { id: summary, weight: 15, kind: section, pattern: 'summary|overview|proposal|abstract|context', desc: "summary / proposal" }
      - { id: alternatives, weight: 20, kind: section, pattern: 'alternative|trade-?off|option|comparison|considered', desc: "alternatives + trade-offs" }
      - { id: openq, weight: 15, kind: section, pattern: 'open question|unresolved|loose end|to be decided|risk', desc: "open questions" }
      - { id: impact, weight: 15, kind: section, pattern: 'impact|migration|rollout|rollback|deployment|phases', desc: "impact / rollout" }
      - { id: decision, weight: 15, kind: section, pattern: 'decision|recommendation|proposal|rollout|what we|chosen', desc: "stated recommendation" }
      - { id: comparison, weight: 5, kind: regex, pattern: '\brejected\b|\bruled out\b|\bdiscarded\b|\bpreferred\b|instead of|rather than|versus|pros and cons|trade-?off', desc: "weighs an alternative (advisory)" }
      - { id: substance, weight: 10, kind: minWords, min: 40, required: true, desc: "not an empty stub (≥40 words of prose)" }
      - { id: nofiller, weight: 5, kind: forbid, pattern: 'lorem ipsum|to be filled (in|out)|to be written|todo:?\s*write|placeholder text|fill (this )?in later|insert [a-z ]+ here', required: true, desc: "no template filler left in" }
    adr:
      - { id: context, weight: 25, kind: section, pattern: 'context|background|problem statement|forces|status quo|situation', desc: "context section" }
      - { id: decision, weight: 25, kind: section, pattern: 'decision|chosen|resolution|outcome|drivers|considered options|what we', desc: "decision section" }
      - { id: consequences, weight: 20, kind: section, pattern: 'consequence|trade-?off|result|implication|pros and cons|negative|impact|risk', desc: "consequences section" }
      - { id: alternatives, weight: 10, kind: regex, pattern: 'option|alternative|considered|weighed|instead of|rather than|versus|pros and cons|\brejected\b', desc: "mentions alternatives (advisory)" }
      - { id: substance, weight: 15, kind: minWords, min: 30, required: true, desc: "not an empty stub (≥30 words of prose)" }
      - { id: nofiller, weight: 5, kind: forbid, pattern: 'lorem ipsum|to be filled (in|out)|to be written|todo:?\s*write|placeholder text|fill (this )?in later|insert [a-z ]+ here', required: true, desc: "no template filler left in" }
    us:
      - { id: story, weight: 15, kind: regex, pattern: '\bas an?\b.+\bi (want|need|would like|wish|can|must)\b', desc: "user-story / job-story form (advisory)" }
      - { id: acceptance, weight: 25, kind: section, pattern: 'acceptance|criteria|scenario|expected behaviou?r|requirement|definition of done', desc: "acceptance-criteria section" }
      - { id: testable, weight: 20, kind: regex, pattern: '^\s*[-*]?\s*\[[ xX]\]|\b(given|when|then)\b', desc: "checkbox / Gherkin criteria (advisory)" }
      - { id: benefit, weight: 10, kind: regex, pattern: '\bso (that|i|we|they|the|my|our|you|it)\b|in order to', desc: "states a benefit (advisory)" }
      - { id: priority, weight: 10, kind: frontmatter, key: priority, desc: "priority set (presence only)" }
      - { id: substance, weight: 15, kind: minWords, min: 30, required: true, desc: "not an empty stub (≥30 words of prose)" }
      - { id: nofiller, weight: 5, kind: forbid, pattern: 'lorem ipsum|to be filled (in|out)|to be written|todo:?\s*write|placeholder text|fill (this )?in later|insert [a-z ]+ here', required: true, desc: "no template filler left in" }
    rel:
      - { id: substance, weight: 30, kind: minWords, min: 30, required: true, desc: "not an empty stub (≥30 words of prose)" }
      - { id: nofiller, weight: 10, kind: forbid, pattern: 'lorem ipsum|to be filled (in|out)|to be written|todo:?\s*write|placeholder text|fill (this )?in later|insert [a-z ]+ here', required: true, desc: "no template filler left in" }

# ── Waivers: the recorded, EXPIRING exception ────────────────────────────────
# The escape hatch a gate needs in order to stay trusted. Without one, a rule
# that is wrong for ONE case leaves two moves: distort the artifact to please
# the checker, or start ignoring the output — and both are worse than an
# exception someone signed. Fields follow Snyk's `.snyk` policy (`reason` +
# `expires` per ignore) and ESLint's `-- <description>` disable comments, with
# ONE deliberate tightening: Snyk allows a permanent ignore by omitting
# `expires`; here `expires` is MANDATORY. Every waiver dies, its finding comes
# back on its own, and accepted debt cannot accumulate silently.
#
# Semantics, all four enforced by the engine:
#   • a waived violation is still REPORTED — it just does not fail the gate;
#   • an EXPIRED waiver suppresses NOTHING, and the output says it expired;
#   • a MALFORMED waiver (missing reason / authorized_by / expires, or naming a
#     rule the gate never emits) is itself a `waiver`-kind violation;
#   • `rule` × `scope` must BOTH match — never a blanket over a file or a rule.
#
# `rule` is a verify kind (coherence, duplicate, frontmatter, id, index,
# placeholder, reference, section, status, waiver) or an eval rubric rule id
# (substance, nofiller, …). `scope` is a repo-relative path or glob (`*`/`?`
# stay inside one segment, `**` crosses them). `authorized_by` is a HUMAN — an
# agent may propose a waiver, never sign one for itself (AGENTS.md).
#
# NOTHING is waived in this repo. The block below is a commented EXAMPLE:
#
# waivers:
#   - rule: index
#     scope: docs/adr/**
#     reason: >-
#       ADR INDEX rows are backfilled by RFC-0031; blocking on them would stall
#       the migration behind a mechanical edit.
#     authorized_by: "@baodq97"
#     expires: 2026-09-30

# ── Ratification policy (RFC-0027) — honor-system tier, engine never reads ───
# It is the RFC-0012 honor-system tier, now WITH a committed text: THE ENGINE
# NEVER READS THIS BLOCK — `verify`/`eval`/`check` behaviour stays byte-for-byte
# unchanged, so the stateless, no-key invariant is untouched (a no-git gate
# cannot see a status transition — RFC-0012, AGENTS.md § Agent constraints
# already says so). It binds the LEAD + the swe-flow skills (`gate-close`)
# that perform a transition, not the gate that structurally cannot see one.
# WHO may act (owner-ratified 2026-07-28): the MAIN agent — the session lead
# the owner talks to directly — carries the owner's delegated authority across
# all three tiers, under each tier's conditions. SUB-AGENTS (dispatched agents,
# workflow agents, skill subagents) are PROPOSE-ONLY: they never flip a status,
# never assign an owner, never merge — their report proposes, the main agent
# applies. One auditable actor per session.
# Tiers status transitions by reversibility (RFC-0027):
#   • R0_owner  — one-way doors: the main agent acts on the owner's explicit
#     in-session direction, cited in the commit — no fresh per-act ask needed,
#     but the direction is never invented. Editing THIS block is itself R0.
#   • R1_packet — recording-of-reality: the main agent may flip WITHOUT a fresh
#     ask iff every condition below holds AND the flip commit cites the evidence.
#   • R2_lead   — no ceremony.
ratification:
  R0_owner:            # one-way doors — owner's in-session direction, cited
    transitions: [prd->approved, rfc->accepted, adr->accepted, "*->superseded", rel->released]
    acts: [merge, publish, "edit:ratification"]   # editing this block is itself R0
  R1_packet:           # recording-of-reality — lead may flip WITHOUT a fresh ask iff ALL hold
    transitions: [rfc:accepted->implemented, us:in-progress->done, "drift --ack"]
    conditions:
      - full_gate_green: bun run check            # the FULL gate, never a narrower command
      - packet_exists                             # a gate-loop packet for THIS slice
      - red_team_in: [flip-as-is, flip-after-reconcile]   # reconcile applied first
      - cite: [packet.runId, "govkit.yml@<sha>"]  # commit cites BOTH the run and the policy
  R2_lead:             # no ceremony
    transitions: [us:open->in-progress, us->blocked]
