      svg.appendChild(el("circle", { cx: from, cy, r: 4, fill: "var(--panel)", stroke: c.line, "stroke-width": 2 }));
      const lo = Math.min(from, ...tos), hi = Math.max(from, ...tos);
      // A short hop is narrower than its own label, so the box would cover the arrow it belongs to.
      const boxY = hi - lo < 210 ? cy - 20 : cy;
      flowMessageBox(svg, (lo + hi) / 2, boxY, m);
      if (m.when) clockBadge(svg, (lo + hi) / 2 + 26, boxY + 20, m.when);
      if (tos.length > 1) svg.appendChild(el("text", { x: hi + 12, y: cy + 4, class: "fl-row" }, `fan-out ×${tos.length}`));
    }
    if (stickyW) contentsSticky(svg, stickyX, cy, m.request || m.contents, m.response, stickyW);
    y += h;
  }
  return { svg, parts, unresolved: [...unresolved] };
}

function renderFlowDiagram(host) {
  const messages = model.messages || [];
  if (!messages.length) return;
  const segs = flowSegments(messages);
  host.append(flowLegend());
  const unresolved = new Set();
  segs.forEach((seg, i) => {
    const { svg, parts, unresolved: u } = drawFlowSegment(seg);
    u.forEach((x) => unresolved.add(x));
    const cap = document.createElement("p");
    cap.className = "flow-seg";
    const range = seg.length > 1 ? `${seg[0].n}–${seg[seg.length - 1].n}` : seg[0].n;
    cap.append(document.createTextNode(segs.length > 1 ? `Segment ${i + 1} of ${segs.length} — messages ${range}` : "Flow"));
    const sub = document.createElement("span");
    sub.textContent = ` · opened by ${bareName(seg[0].from)}: ${seg[0].message} · ${seg.length} messages, ${parts.length} participants`;
    cap.append(sub);
    const box = document.createElement("div");
    box.className = "flow-svg";
    box.append(svg);
    host.append(cap, box);
  });
  // Named in the table, not drawable as a participant. Saying so beats inventing a node — one of
  // these cells reads "(nobody, until 5)", which is a stated absence, not a participant.
  if (unresolved.size) {
    const p = document.createElement("p");
    p.className = "doc-warn";
    p.textContent = `${unresolved.size} participant${unresolved.size > 1 ? "s" : ""} could not be `
      + `typed against the context map or discovery, so ${unresolved.size > 1 ? "they are" : "it is"} `
      + `not drawn: ${[...unresolved].join(", ")}.`;
    host.append(p);
  }
}

function renderFlow() {
  const host = docHost(model.name || "Message flow", model.scenario);
  const n = (model.messages || []).length;
  const over = n > 9;

  const note = document.createElement("p");
  note.className = over ? "doc-warn" : "doc-ok";
  note.textContent = over
    ? `${n} messages — over the 5-to-9 range. The notation reads that as the cut being refuted, not as a long scenario.`
    : `${n} messages, inside the 5-to-9 range.`;
  host.append(note);

  host.classList.add("wide");
  renderFlowDiagram(host);

  // The When column only appears when a scenario actually has a time-driven message. Showing an
  // empty column on every flow would train people to ignore it.
  const timed = (model.messages || []).some((m) => m.when);
  const cols = [["n", "#"], ["from", "From"], ["message", "Message"], ["type", "Type"],
                ["to", "To"], ["contents", "Contents"]].concat(timed ? [["when", "When"]] : []);
  const table = docTable(cols, model.messages || [], (td, key, m) => {
    if (key === "message") td.className = "mono";
    if (key === "type" && m.type) td.className = `mtype ${m.type}`;
    if (key === "when" && m.when) {
      td.style.color = "var(--warn)";
      td.style.whiteSpace = "nowrap";
    }
  }, "doc-table flow");
  host.append(table);
  listBlock(host, "Findings", model.findings, "warn");
  listBlock(host, "Open questions", model.questions);
}

// Complexity across, differentiation up. ddd-crew names no quadrants and the axis labels change
// between the portfolio and migration variants, so both come from the artifact rather than from
// here — this draws whatever the chart declared.
// One chart, drawn twice with different dot colours. The frame, the axes, the quadrant labels and
// the label de-collision are the same work; keeping two copies had already produced two collision
// thresholds, a missing axis label and a missing dashed style for unplaced dots.
function chartFrame({ size = 480, padL = 88, padR = 210, pad = 54 } = {}) {
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("width", padL + size + padR);
  s.setAttribute("height", size + pad * 2);
  s.setAttribute("class", "chart");
  const X = (v) => padL + v * size;
  const Y = (v) => pad + size - v * size;

  s.appendChild(el("rect", { x: X(0), y: Y(1), width: size, height: size, fill: "none", stroke: "var(--line)" }));
  s.appendChild(el("line", { x1: X(0), y1: Y(0.5), x2: X(1), y2: Y(0.5), stroke: "var(--line)", "stroke-dasharray": "3 4" }));
  s.appendChild(el("line", { x1: X(0.5), y1: Y(1), x2: X(0.5), y2: Y(0), stroke: "var(--line)", "stroke-dasharray": "3 4" }));

  // Axis labels and quadrant names come from the artifact: ddd-crew names no quadrants, and the
  // migration variant of this chart relabels y.
  const axes = model.axes || {};
  const ax = axes.x || { low: "Low complexity", high: "High complexity" };
  const ay = axes.y || { low: "Low differentiation", high: "High differentiation" };
  s.appendChild(el("text", { x: X(0), y: Y(0) + 22, class: "axis" }, ax.low));
  s.appendChild(el("text", { x: X(1), y: Y(0) + 22, class: "axis", "text-anchor": "end" }, ax.high));
  for (const [label, at, anchor] of [[ay.low, 0, "start"], [ay.high, 1, "end"]]) {
    // Written along the axis: horizontal y labels either collide with the plot or get clipped.
    const node = el("text", { class: "axis", "text-anchor": anchor }, label);
    node.setAttribute("transform", `translate(${X(0) - 14}, ${Y(at)}) rotate(-90)`);
    s.appendChild(node);
  }
  for (const q of model.quadrants || []) {
    const left = q.n === 2 || q.n === 3;
    s.appendChild(el("text", {
      x: left ? X(0.02) : X(0.98), y: q.n <= 2 ? Y(0.97) : Y(0.03),
      class: "quadrant", "text-anchor": left ? "start" : "end",
    }, q.label));
  }
  return { svg: s, X, Y };
}

// Contexts cluster — a bought adapter and a lookup table sit in the same corner by definition.
// Labels are pushed down until they clear the one above, with a leader line back to the dot.
function plotPoints(svg, X, Y, points, colourOf) {
  const placed = [];
  // Labels were pushed down without a floor, so a crowded corner walked them straight through the
  // x-axis caption. Stop at the plot edge and search back upward instead.
  const floor = Y(0) - 6;
  const ceiling = Y(1) + 12;
  for (const p of [...points].sort((a, b) => Y(a.y) - Y(b.y))) {
    const cx = X(p.x);
    const cy = Y(p.y);
    const clear = (y) => !placed.some((q) => Math.abs(q.y - y) < 14 && Math.abs(q.x - cx) < 195);
    let ly = cy + 4;
    while (ly <= floor && !clear(ly)) ly += 14;
    if (ly > floor) {
      ly = cy - 10;
      while (ly >= ceiling && !clear(ly)) ly -= 14;
      if (ly < ceiling) ly = cy + 4;
    }
    placed.push({ x: cx, y: ly });

    const colour = colourOf ? colourOf(p) : "var(--core)";
    const g = el("g", { class: "node" });
    g.appendChild(el("circle", {
      cx, cy, r: 7,
      fill: p.unplaced ? "none" : colour, stroke: colour,
      "stroke-dasharray": p.unplaced ? "3 3" : null, opacity: p.unplaced ? 0.75 : 0.85,
    }));
    if (Math.abs(ly - cy) > 8) {
      g.appendChild(el("line", { x1: cx + 7, y1: cy, x2: cx + 15, y2: ly - 4, stroke: "var(--line)", "stroke-width": 1 }));
    }
    g.appendChild(el("text", { x: cx + 17, y: ly, class: "name", fill: colour === "var(--core)" ? null : colour }, p.name));
    g.appendChild(el("title", {}, p.note || ""));
    svg.appendChild(g);
  }
}

function renderChart() {
  const host = docHost("Core domain chart", "Complexity across · differentiation up. A dot on the mid-line is not a placement — it is a conversation that has not happened.");
  const { svg, X, Y } = chartFrame({ size: 520 });
  plotPoints(svg, X, Y, model.points || []);
  host.append(svg);
  listBlock(host, "Decisions", model.decisions);
  listBlock(host, "Investment mismatch", model.mismatch, "warn");
  listBlock(host, "Open questions", model.questions);
}

// The same chart, with ownership on it. This is the version that settles two questions at once —
// where the investment goes, and who is holding it — which is why ddd-crew lists it as one of the
// three uses. A team whose dots are scattered across both axes is carrying unrelated bets.
// Team colours double as label text, so every one has to clear 4.5:1 on the page background —
// the first green and blue picked here read at 2.97:1 and were a team name nobody could see.
const TEAM_COLOURS = ["#b8541c", "#1f6f9a", "#1f7a3d", "#7b3fa0", "#a8560f", "#2f6fb0"];
const nameKey = (s) => String(s).replace(/[^a-z0-9]/gi, "").toLowerCase();

function renderChartTeams() {
  const teams = model.teams || {};
  const byContext = teams.byContext || {};
  const names = [...new Set(Object.values(byContext).map((t) => t.team).filter(Boolean))];
  const colour = (team) => TEAM_COLOURS[names.indexOf(team) % TEAM_COLOURS.length] || "var(--muted)";
  const owner = new Map(Object.entries(byContext).map(([k, v]) => [nameKey(k), v]));
  const teamOf = (p) => owner.get(nameKey(p.name));

  const host = docHost("Core domain chart — with Team Topologies",
    teams.caveat || "Each dot coloured by the team proposed to own it.");
  const { svg, X, Y } = chartFrame({ padR: 230 });
  plotPoints(svg, X, Y, model.points || [], (p) => {
    const t = teamOf(p);
    return t && t.team ? colour(t.team) : "var(--muted)";
  });
  host.append(svg);

  const key = document.createElement("p");
  key.className = "doc-sub";
  key.style.marginTop = "10px";
  key.append(document.createTextNode("Teams: "));
  for (const n of names) {
    const chip = document.createElement("span");
    chip.textContent = ` ● ${n} `;
    chip.style.color = colour(n);
    chip.style.fontWeight = "600";
    key.append(chip);
  }
  host.append(key);

  if ((teams.interactions || []).length) {
    host.append(docHeading(`Interaction modes`, teams.interactions.length));
    host.append(docTable(
      [["a", "Team"], ["b", "Team"], ["mode", "Mode"], ["why", "Evidence"], ["endsWhen", "Ends when"]],
      teams.interactions,
      (td, key2, row) => { if (key2 === "a" || key2 === "b") td.style.color = colour(row[key2]); },
    ));
  }

  const unowned = (model.points || []).filter((p) => !teamOf(p)).map((p) => p.name);
  listBlock(host, "Plotted but unowned", unowned, "warn");
}

// The three team relationships ddd-crew defines, which the nine-pattern map cannot show: mutual
// dependence, one-way dependence, and — invisible on any pattern map because it is drawn by an
// absence — freedom.
const RELATION_LABEL = {
  "mutually-dependent": "Mutually dependent — they ship together or not at all",
  "upstream-downstream": "Upstream → downstream — the upstream can succeed alone",
  free: "Free — no organisational or technical link",
  unclassified: "Unclassified — the pattern name maps to no team relationship",
};

function renderRelations() {
  const rels = model.relationships || [];
  const sourced = rels.filter((r) => r.sourced).length;
  const host = docHost("Team relationships",
    `${rels.length} edges. ${sourced} follow ddd-crew's own wording; the remaining ${rels.length - sourced} are this plugin's reading of the pattern, not a published mapping.`);

  for (const kind of ["mutually-dependent", "upstream-downstream", "unclassified"]) {
    let group = rels.filter((r) => r.teamRelation === kind);
    if (kind === "mutually-dependent") {
      // Both contexts declare the partnership, so the edge arrives twice. It is one relationship.
      const seen = new Set();
      group = group.filter((r) => {
        const key = [r.from, r.to].sort().join("|");
        return seen.has(key) ? false : seen.add(key);
      });
    }
    if (!group.length) continue;
    host.append(docHeading(RELATION_LABEL[kind], group.length));
    host.append(docTable(
      [["from", "From"], ["arrow", ""], ["to", "To"], ["type", "Pattern"], ["basis", "Basis"]],
      group.map((r) => ({
        from: r.from, arrow: kind === "mutually-dependent" ? "↔" : "→", to: r.to,
        type: r.type, basis: r.sourced ? "ddd-crew" : "plugin reading",
      })),
      (td, key, row) => { if (key === "basis" && row.basis !== "ddd-crew") td.style.color = "var(--warn)"; },
    ));
  }

  const free = model.free || [];
  const h = document.createElement("h3");
  h.className = "doc-h3";
  h.textContent = `Free — ${free.length}`;
  host.append(h);
  const p = document.createElement("p");
  p.className = free.length ? "doc-ok" : "doc-warn";
  p.textContent = free.length
    ? `${free.join(", ")} — nothing points at these and they point at nothing, so a team owning one can move without asking anybody.`
    : "No context is free: every one of them is coupled to at least one other. That is not automatically wrong, but it means no team here can ship without a conversation.";
  host.append(p);
}

// The wall, as a wall. Confirmed-vs-candidate is the column that matters: a timeline nobody
// confirmed is a document review wearing an EventStorming costume.
const EL_TYPE = { event: "#f5a623", command: "#4a90d9", policy: "#9b59b6", "read-model": "#2fa84f",
                  actor: "#f7d774", "external-system": "#e8a0a0", hotspot: "#d0021b" };

function renderTimeline() {
  const c = model.confidence || {};
  const host = docHost("Discovery timeline",
    `${(model.elements || []).length} elements · ${c.confirmed ?? "?"} confirmed · ${c.candidates ?? "?"} candidate · ${(model.hotspots || []).length} hotspots`);

  if ((c.confirmed ?? 0) === 0 && (model.elements || []).length) {
    const w = document.createElement("p");
    w.className = "doc-warn";
    w.textContent = "Nothing here was confirmed by a person. Every element is mined from documents, and everything downstream inherits that.";
    host.append(w);
  }

  const wall = document.createElement("div");
  wall.className = "wall";
  for (const e of model.elements || []) {
    const card = document.createElement("div");
    const type = String(e.type || "event").toLowerCase();
    card.className = `sticky${e.status === "candidate" ? " candidate" : ""}`;
    card.style.borderTopColor = EL_TYPE[type] || "var(--line)";
    const name = document.createElement("b");
    name.textContent = e.name || e.Element || "—";
    const meta = document.createElement("span");
    meta.textContent = [type, e.actor, e.source].filter(Boolean).join(" · ");
    card.append(name, meta);
    wall.append(card);
  }
  host.append(wall);
  listBlock(host, "Hotspots", (model.hotspots || []).map((h) =>
    typeof h === "string" ? h : `${h.id ? h.id + " — " : ""}${h.question || h.text || JSON.stringify(h)}`), "warn");
}

// Everything without a dedicated lens, rendered as its own sections with its tables intact. This
// is deliberately not a markdown viewer: it keeps the artifact's structure, so a reviewer can see
// that a section exists and is empty.
function renderSections() {
  const host = docHost(model.title || "Document");
  for (const sec of model.sections || []) {
    host.append(docHeading(sec.heading));
    if (sec.rows && sec.rows.length) {
      const cols = Object.keys(sec.rows[0]).map((c) => [c, c]);
      host.append(docTable(cols, sec.rows));
    } else if (sec.lines && sec.lines.length) {
      const ul = document.createElement("ul");
      ul.className = "doc-list";
      for (const line of sec.lines) {
        const li = document.createElement("li");
        li.textContent = line;
        ul.append(li);
      }
      host.append(ul);
    } else {
      const p = document.createElement("p");
      p.className = "doc-empty";
      p.textContent = "empty";
      host.append(p);
    }
  }
}

// ---------------------------------------------------------------- mass view
//
// The map deliberately draws every context the same size, which is right for reading boundaries
// and wrong for reading effort. This view answers "where does the weight actually sit".

function detailOf(ctx) {
  const c = ctx.counts || {};
  const detail = [`${massOf(ctx)} elements`];
  if (c.aggregates !== undefined) detail.push(`${c.aggregates} agg`);
  if (c.events) detail.push(`${c.events} events`);
  if (c.invariants !== undefined) detail.push(`${c.invariants} inv`);
  if (ctx.attrCount) detail.push(`${ctx.attrCount} attrs`);
  if (ctx.densestAttrs) detail.push(`densest ${ctx.densestAttrs}`);
  const open = (ctx.openQuestions || []).length;
  if (open) detail.push(`${open} open`);
  return detail.join(" · ");
}

function renderMass() {
  const rows = (model.contexts || [])
    .slice()
    .sort((a, b) => massOf(b) - massOf(a));
  const width = Math.max(720, document.getElementById("canvas-wrap").clientWidth - 48);
  const rowH = 34;
  const details = new Map(rows.map((c) => [c.id, detailOf(c)]));
  // Both gutters sized from their own content: at 150px fixed, `RevenueReconciliation` ran 21px
  // into the bar, and `… 22 attrs` fell off the right edge of the viewBox as `… 22 a`.
  const labelW = Math.ceil(PAD + widestOf(rows.map((c) => c.name), { size: 13, weight: 620 })) + 18;
  const detailW = Math.ceil(widestOf([...details.values()], { size: 10.5 })) + 24;
  const barMax = Math.max(120, width - labelW - detailW - PAD);
  const height = PAD * 2 + 30 + rows.length * rowH;

  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.replaceChildren();

  svg.appendChild(el("text", { x: PAD, y: PAD + 4, class: "band-label" },
    `Model mass per context — total ${rows.reduce((s, c) => s + massOf(c), 0)} elements (entities, value objects, events, invariants)`));

  rows.forEach((ctx, i) => {
    const y = PAD + 26 + i * rowH;
    const style = TYPE_STYLE[ctx.subdomainType || "supporting"] || TYPE_STYLE.supporting;
    const group = el("g", { class: "node" });

    group.appendChild(el("text", { x: PAD, y: y + 15, class: "name", fill: style.stroke }, ctx.name));
    group.appendChild(el("rect", {
      x: labelW, y: y + 3, width: barMax, height: 16, rx: 3, class: "mass-bar-bg",
    }));
    const w = Math.max(3, (barMax * massOf(ctx)) / maxMass());
    group.appendChild(el("rect", {
      x: labelW, y: y + 3, width: w, height: 16, rx: 3, fill: style.stroke, opacity: 0.8,
    }));

    group.appendChild(el("text", { x: labelW + barMax + 12, y: y + 16, class: "sub" }, details.get(ctx.id)));

    group.addEventListener("click", () => select(ctx.id));
    svg.appendChild(group);
  });

  renderLegend();
}

// ---------------------------------------------------------------- matrix view
//
// A dependency structure matrix. On a map with 15 edges a two-way dependency is just two more
// crossing lines; here it is a pair of cells straddling the diagonal, which is why the
// Finance <-> Initiative cycle is the first thing the eye lands on.

function renderMatrix() {
  const contexts = (model.contexts || []).slice().sort((a, b) => a.name.localeCompare(b.name));
  const n = contexts.length;
  // The densest artifact in the set was drawn smallest: 30px cells in the corner of a 1250px
  // column. Size the cell to the space actually available, bounded so two contexts do not produce
  // two enormous squares and twenty do not produce invisible ones.
  const avail = Math.max(720, document.getElementById("canvas-wrap").clientWidth - 48);
  const nameW = Math.ceil(widestOf(contexts.map((c) => c.name), { size: 11, weight: 600 }));
  const labelW = PAD + nameW + 10;
  const cell = Math.max(28, Math.min(58, Math.floor((avail - labelW - PAD * 2) / Math.max(n, 1))));
  // Column heads are rotated -55°, so a name runs name-width × sin(55°) up and × cos(55°) right.
  // The last column's head needs that horizontal run as right margin or it leaves the viewBox.
  const headH = Math.ceil(nameW * 0.83) + 14;
  const width = labelW + n * cell + Math.ceil(nameW * 0.58) + PAD;
  const height = PAD * 2 + headH + n * cell;

  svg.setAttribute("width", width);
  svg.setAttribute("height", height);
  svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
  svg.replaceChildren();

  const grid = el("g", { class: "matrix" });
  const index = new Map(contexts.map((c, i) => [c.name, i]));
  const edges = new Map();
  for (const rel of model.relationships || []) {
    if (index.has(rel.from) && index.has(rel.to)) edges.set(`${rel.from}>${rel.to}`, rel.type);
  }

  grid.appendChild(el("text", { x: PAD, y: PAD + 4, class: "band-label" }, "Row depends on column"));

  contexts.forEach((ctx, col) => {
    const x = labelW + col * cell + cell / 2;
    const y = PAD + headH - 6;
    const label = el("text", { x, y, "text-anchor": "start", fill: "var(--muted)" }, ctx.name);
    label.setAttribute("transform", `rotate(-55 ${x} ${y})`);
    grid.appendChild(label);
  });

  contexts.forEach((rowCtx, row) => {
    const y = PAD + headH + row * cell;
    grid.appendChild(el("text", {
      x: labelW - 8, y: y + cell / 2 + 4, "text-anchor": "end", class: "rowhead",
      fill: (TYPE_STYLE[rowCtx.subdomainType] || TYPE_STYLE.supporting).stroke,
    }, rowCtx.name));

    contexts.forEach((colCtx, col) => {
      const x = labelW + col * cell;
      if (row === col) {
        grid.appendChild(el("rect", { x, y, width: cell, height: cell, class: "cell diag" }));
        return;
      }
      const type = edges.get(`${rowCtx.name}>${colCtx.name}`);
      const reverse = edges.get(`${colCtx.name}>${rowCtx.name}`);
      const style = type ? REL_STYLE[type] || DEFAULT_REL : null;
      grid.appendChild(el("rect", {
        x, y, width: cell, height: cell, class: "cell",
        fill: style ? style.stroke : "#f7f6f4",
        opacity: style ? 0.85 : 1,
      }));
      if (type && reverse) {
        // Both directions present: a cycle, and the only thing on this view drawn in outline.
        grid.appendChild(el("rect", {
          x: x + 3, y: y + 3, width: cell - 6, height: cell - 6,
          fill: "none", stroke: "#ffffff", "stroke-width": 2,
        }));
      }
    });
  });

  const cycles = [];
  for (const key of edges.keys()) {
    const [from, to] = key.split(">");
    if (edges.has(`${to}>${from}`) && from < to) cycles.push(`${from} ⇄ ${to}`);
  }
  svg.appendChild(grid);

  // A mutual dependency refutes the cut, so this line is the reason the view exists. It goes in
  // HTML, where it wraps: as SVG text it was one 3,708px line inside a 720px viewBox, cut to
  // "…GuidanceIntegration ⇄ Pa".
  const note = document.createElement("div");
  note.className = cycles.length ? "doc-warn" : "doc-ok";
  note.textContent = cycles.length
    ? `${cycles.length} mutual ${cycles.length === 1 ? "dependency" : "dependencies"} — the outlined cells above. Two contexts that depend on each other ship together or not at all.`
    : "No mutual dependencies. Every relationship on this matrix runs one way.";
  if (cycles.length) {
    const list = document.createElement("ul");
    list.className = "pairs";
    for (const pair of cycles) {
      const li = document.createElement("li");
      li.textContent = pair;
      list.append(li);
    }
    note.append(list);
  }
  document.getElementById("diagram-note").append(note);

  renderLegend();
}

// ---------------------------------------------------------------- detail panel

function select(id) {
  selectedId = selectedId === id ? null : id;
  render();
  if (selectedId) send({ type: "select", context: nameOf(selectedId) });
}

function listOr(items, emptyText) {
  if (!items || items.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = emptyText;
    return p;
  }
  const ul = document.createElement("ul");
  for (const item of items) {
    const li = document.createElement("li");
    li.textContent = typeof item === "string" ? item : `${item.term} — ${item.definition}`;
    ul.appendChild(li);
  }
  return ul;
}

function heading(text) {
  const h = document.createElement("h3");
  h.textContent = text;
  return h;
}

function renderPanel() {
  const panel = document.getElementById("panel");
  panel.replaceChildren();

  if (!selectedId) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Pick a context to see its detail, or send feedback on the boundary.";
    panel.append(p);
    return;
  }

  const ctx = (model.contexts || []).find((c) => c.id === selectedId);
  if (!ctx) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = `${nameOf(selectedId)} — an external system, outside the model.`;
    panel.append(p);
    return;
  }

  const h2 = document.createElement("h2");
  h2.textContent = ctx.name;
  const pill = document.createElement("span");
  pill.className = "pill";
  pill.textContent = ctx.subdomainType || "supporting";
  const purpose = document.createElement("p");
  purpose.className = "purpose";
  purpose.textContent = ctx.purpose || "No purpose stated.";
  panel.append(h2, pill, purpose);

  if (ctx.tableCount) {
    const stat = document.createElement("p");
    stat.className = "purpose";
    const bits = [`${ctx.tableCount} tables`];
    if (ctx.attrCount !== null && ctx.attrCount !== undefined) bits.push(`~${ctx.attrCount} legacy attrs`);
    if (ctx.densestAttrs) bits.push(`densest table ${ctx.densestAttrs} attrs`);
    if (ctx.layer) bits.push(`layer ${ctx.layer}`);
    stat.textContent = bits.join(" · ");
    panel.append(stat);
  }

  if (ctx.tables && ctx.tables.length) {
    panel.append(heading(`Tables (${ctx.tables.length})`), listOr(ctx.tables, ""));
  }

  panel.append(heading("Ubiquitous language"), listOr(ctx.ubiquitousLanguage, "Nothing recorded."));
  panel.append(
    heading("Aggregates"),
    listOr((ctx.aggregates || []).map((a) => a.name), "None — right-sized deliberately; see notes."),
  );
  panel.append(heading("Assumptions"), listOr(ctx.assumptions, "Nothing recorded."));
  panel.append(heading("Open questions"), listOr(ctx.openQuestions, "No open questions."));

  panel.append(heading("Feedback"));
  const box = document.createElement("div");
  box.className = "fb";
  const actions = [
    ["boundary-wrong", "This boundary is wrong"],
    ["should-merge", "Merge with another context"],
    ["should-split", "Split this apart"],
    ["wrong-classification", `Not "${ctx.subdomainType}"`],
    ["not-a-context", "A capability, not a context"],
  ];
  for (const [kind, label] of actions) {
    const button = document.createElement("button");
    button.textContent = label;
    button.addEventListener("click", async () => {
      await send({ type: "feedback", kind, context: ctx.name, contextId: ctx.id });
      button.classList.add("sent");
      button.textContent = `${label} ✓ recorded`;
    });
    box.appendChild(button);
  }
  panel.append(box);

  const hint = document.createElement("p");
  hint.className = "empty";
  hint.style.marginTop = "10px";
  hint.textContent = "Recorded. The agent reads this on its next turn and updates the model.";
  panel.append(hint);
}

// ---------------------------------------------------------------- feedback + live channel

async function send(event) {
  try {
    await fetch("feedback", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(event),
    });
  } catch {
    /* the picture stays usable even if the server went away */
  }
}

function setConnected(ok) {
  document.getElementById("conn-dot").className = ok ? "dot" : "dot off";
  document.getElementById("conn-text").textContent = ok ? "live" : "disconnected — retrying";
}

function connect() {
  const stream = new EventSource("stream");
  stream.addEventListener("hello", () => setConnected(true));
  stream.addEventListener("model", () => load());
  stream.onerror = () => {
    setConnected(false);
    stream.close();
    setTimeout(connect, 2000);
  };
}

// Only the map and the mass bars read the viewport; the other 25 documents are DOM flow. A window
// drag fires this 30-60 times a second, and rebuilding a 27-button rail plus a 109-element SVG to
// produce byte-identical output is the most expensive thing this page can do.
let lastWidth = 0;
let resizePending = false;
window.addEventListener("resize", () => {
  if (!["map", "mass"].includes(currentView) || resizePending) return;
  resizePending = true;
  requestAnimationFrame(() => {
    resizePending = false;
    const w = document.getElementById("canvas-wrap").clientWidth;
    if (w === lastWidth) return;
    lastWidth = w;
    render();
  });
});
document.getElementById("toggle-light").addEventListener("change", (e) => {
  hideLight = e.target.checked;
  render();
});

// `?static=1` renders once and skips the live channel. An open event-stream keeps the page
// permanently "loading", which stalls headless screenshots and print-to-PDF — snapshot mode is
// how a picture gets exported for a doc, a slide, or a CI artifact.
const IS_STATIC = QS.get("static") === "1";

load().then(() => {
  if (IS_STATIC) {
    document.getElementById("conn").style.display = "none";
    return;
  }
  connect();
});
</script>
</body>
</html>
