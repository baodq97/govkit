name: ci

on:
  push:
  pull_request:

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The governance gate — toolchain-agnostic, no ANTHROPIC_API_KEY, no Claude.
      # `npx` fetches govkit on demand; pin a version for reproducible CI (e.g. govkit@0.7).
      # check = verify (structural gate) + eval (quality floor + advisory score) in one pass —
      # the single gate a CI calls.
      - name: govkit check
        run: npx --yes govkit check

      # Add your own steps below (install / lint / typecheck / test for your stack).
      # - run: <your build & tests>
